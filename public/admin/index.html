<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="/brand/favicon">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/admin/admin.css">
</head>
<body>
  <section class="login" id="login" hidden>
    <form class="login-card" id="loginForm">
      <div class="brand" data-brand></div>
      <h1>Ingresar al panel</h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Contraseña<input name="password" type="password" required autocomplete="current-password"></label>
      <p class="error" id="loginError"></p>
      <button class="btn primary">Entrar</button>
    </form>
  </section>

  <div class="layout" id="app" hidden>
    <aside class="sidebar" id="sidebar">
      <div class="brand" data-brand></div>
      <nav id="menu"></nav>
      <div class="me"><span id="meName"></span><a href="/" target="_blank">Ver tienda ↗</a><button id="logout">Salir</button></div>
    </aside>
    <main class="main">
      <header class="topbar"><button class="burger" id="burger" aria-label="Menú">☰</button><h1 id="pageTitle"></h1><div id="pageActions"></div></header>
      <div class="content" id="view"></div>
    </main>
  </div>

  <dialog id="modal"><form method="dialog" class="modal-inner" id="modalForm"><header><h2 id="modalTitle"></h2><button value="cancel" class="x" formnovalidate aria-label="Cerrar">×</button></header><div id="modalBody"></div><footer id="modalFoot"></footer></form></dialog>
  <div class="toasts" id="toasts"></div>
  <script type="module" src="/admin/admin.js"></script>
</body>
</html>
